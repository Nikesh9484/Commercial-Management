# Render.com Blueprint – creates the web service in one go ("Deploy to Render" button in README).
services:
  - type: web
    name: commercial-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Commercial Manager
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Database backups go to this private GitHub repository (created for you).
      - key: BACKUP_GITHUB_REPO
        value: Nikesh9484/Commercial-Management-data
      - key: BACKUP_GITHUB_TOKEN
        sync: false
